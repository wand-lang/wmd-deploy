# Deploy to Fly when what the image or the driver is made from changes.
# The server's own commits change the Library and world.json, which a
# running server takes in with /pull, so they deploy nothing.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - fly.toml
      - deploy/**
      - wand.pkg
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
